# This file is managed by terraform, do not edit manually
#  Created by: https://github.com/dsb-infra/github-terraform-config

version: 2

# Shared Dependabot configuration for DSB terraform modules: the module at the repository root. Every terraform
# module gets this same file, so it must not name anything specific to one repo.
#
# The examples in examples/ call the module by its local path and pin nothing of their own, so the root is the
# only directory with dependencies. The modules constrain their providers with ranges: Dependabot raises a pull
# request when a release falls outside a module's range, such as a new provider major.
#
# Each pull request meets github-actions-terraform's Dependabot admission in the module workflow, which the
# calling workflow switches on with `dependabot-admission-enabled: true`: only an admitted one is validated and
# tested, and it gets its regenerated README committed.
#
# The `chore:` prefix makes no module release (release-please releases on `feat:` and `fix:`): a bump is
# released with the next change that is one.
updates:
  - package-ecosystem: "terraform"
    directories: ["/"]
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore: bump tf dep"
    schedule:
      interval: "daily"
      time: "03:00"
    groups:
      dependencies:
        patterns: ["*"]
        group-by: dependency-name

